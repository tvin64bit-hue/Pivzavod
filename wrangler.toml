# Конфигурация Cloudflare Pages.
# Настройки сборки продублированы здесь, чтобы они жили в репозитории,
# а не только в панели: подхватываются и при деплое через дашборд,
# и при `npx wrangler pages deploy`.

name = "pivzavod74"

# Дата совместимости рантайма Workers. Меняется осознанно: сдвиг вперёд
# включает новое поведение платформы и может изменить работу функции.
compatibility_date = "2026-08-01"

# Каталог собранной статики. Каталог functions/ Cloudflare находит сам.
pages_build_output_dir = "dist"

# Секреты TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID здесь НЕ хранятся —
# только в панели (Settings → Variables and Secrets) или через
# `npx wrangler pages secret put TELEGRAM_BOT_TOKEN`.
